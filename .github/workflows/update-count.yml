name: update-member-count
on:
  schedule:
    - cron: "30 21 * * *"   # 毎朝6:30 JST
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/update_count.py
      - run: |
          git config user.name "yumekane-town"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || { git commit -m "自動更新: サロン人数"; git push; }
